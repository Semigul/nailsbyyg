name: Label-based workflow hints

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened, synchronize, labeled, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  issue-labels:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Comment for refinement
        if: github.event.label.name == 'needs-refinement'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                'Refinement is now requested.',
                '',
                'Please add a short problem statement, success criteria, and any constraints before implementation begins.'
              ].join('\n')
            });

      - name: Comment for implementation
        if: github.event.label.name == 'ready-for-dev'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                'Implementation can start.',
                '',
                'Please create a draft PR, keep the scope focused, and link the PR back to this issue.'
              ].join('\n')
            });

  pr-labels:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Track linked issue and update labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr?.body || '';
            const match = body.match(/(?:close|closes|fix|fixes|resolve|resolves)\s+#(\d+)/i);
            if (!match) {
              core.info('No linked issue found in PR body.');
              return;
            }

            const issueNumber = Number(match[1]);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (['opened', 'reopened', 'synchronize'].includes(context.payload.action)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ['in-development']
              });
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issueNumber,
                name: 'needs-refinement'
              }).catch(() => {});
            }

            if (context.payload.action === 'labeled' && context.payload.label?.name === 'ready-for-review') {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ['ready-for-review', 'approve-pr']
              });
            }

            if (context.payload.action === 'closed' && context.payload.pull_request.merged) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ['approved']
              });
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issueNumber,
                name: 'approve-pr'
              }).catch(() => {});
            }

      - name: Comment for review
        if: github.event.action == 'labeled' && github.event.label.name == 'ready-for-review'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                'This PR is ready for review.',
                '',
                'The review agent should check correctness, security, performance, and test coverage before approval.'
              ].join('\n')
            });

      - name: Comment for staging
        if: github.event.action == 'labeled' && github.event.label.name == 'ready-for-staging'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                'This PR is marked ready for staging.',
                '',
                'A human maintainer should confirm the change before releasing it to the test environment.'
              ].join('\n')
            });
