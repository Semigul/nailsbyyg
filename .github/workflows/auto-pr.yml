name: Auto PR for ready-for-dev issues

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-draft-pr:
    if: github.event.label.name == 'ready-for-dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create or update working branch for the issue
        env:
          GH_TOKEN: ${{ secrets.COPILOT_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH_NAME="issue-${{ github.event.issue.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Branch $BRANCH_NAME already exists on origin."
          else
            git checkout -B "$BRANCH_NAME" origin/main
            git push origin "$BRANCH_NAME"
          fi

      - name: Create draft PR for the issue
        env:
          GH_TOKEN: ${{ secrets.COPILOT_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"
          BRANCH_NAME="issue-$ISSUE_NUMBER"

          existing_pr_number=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH_NAME" \
            --state all \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing_pr_number" ]; then
            echo "PR #$existing_pr_number already exists for $BRANCH_NAME."
            exit 0
          fi

          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH_NAME" \
            --draft \
            --title "$ISSUE_TITLE" \
            --body "Closes #$ISSUE_NUMBER"

      - name: Assign issue to Copilot coding agent
        env:
          GH_TOKEN: ${{ secrets.COPILOT_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/issues/${{ github.event.issue.number }} \
            --input - <<'JSON'
          {
            "assignees": ["copilot-swe-agent[bot]"],
            "agent_assignment": {
              "target_repo": "${{ github.repository }}",
              "base_branch": "issue-${{ github.event.issue.number }}",
              "custom_instructions": "Implement the issue in this repository. Keep changes scoped, follow existing project conventions, add or update tests when relevant, and open a pull request with a clear summary.",
              "custom_agent": "",
              "model": ""
            }
          }
          JSON

      - name: Comment with next step
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                'A draft pull request has been created and the issue has been handed to the Copilot coding agent.',
                '',
                'Work will continue on branch `issue-${{ github.event.issue.number }}` and the linked PR should update as implementation progresses.',
                '',
                'You can open that branch in VS Code if you want to review or refine the implementation.'
              ].join('\n')
            });
