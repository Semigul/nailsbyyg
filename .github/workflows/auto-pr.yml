name: Auto PR for ready-for-dev issues

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-draft-pr:
    if: github.event.label.name == 'ready-for-dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create working branch for the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH_NAME="issue-${{ github.event.issue.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$BRANCH_NAME" origin/main
          git push origin "$BRANCH_NAME" --force-with-lease

      - name: Create draft pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH_NAME="issue-${{ github.event.issue.number }}"
          PR_TITLE="[WIP] Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          PR_BODY="Closes #${{ github.event.issue.number }}

## Work in progress
This is a draft PR created automatically for the linked issue.

Related issue: #${{ github.event.issue.number }}"
          
          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME" \
            --draft || true

      - name: Comment with status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '✅ Draft PR created and implementation starting...',
                '',
                'Branch: `issue-${{ github.event.issue.number }}`'
              ].join('\n')
            });
