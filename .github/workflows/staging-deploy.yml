name: Staging deploy

on:
  workflow_dispatch:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run worker tests
        run: npm run test:worker

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Placeholder staging deploy
        run: |
          echo "Deploy to staging environment would happen here."
          echo "Use this job to publish to your staging host or preview environment."
