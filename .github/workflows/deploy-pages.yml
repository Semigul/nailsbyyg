name: Publicera till GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kontrollera JavaScript
        run: |
          node --check app.js
          node --check customer.js
          node --check firebase-client.mjs
          node --check postnord-rates.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Skapa Firebase-konfiguration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::error::Repository secret FIREBASE_CONFIG saknas"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const config = JSON.parse(process.env.FIREBASE_CONFIG);
            const required = ["apiKey", "authDomain", "projectId", "appId"];
            const missing = required.filter((key) => !config[key]);
            if (missing.length) {
              throw new Error(`FIREBASE_CONFIG saknar: ${missing.join(", ")}`);
            }
            const cloudinary = config.cloudinary || {
              cloudName: config.cloudinaryCloudName,
              signEndpoint: config.cloudinarySignEndpoint,
              uploadPreset: config.cloudinaryUploadPreset,
              folder: config.cloudinaryFolder || "nailsbyyg-orders"
            };
            const hasCloudinary = cloudinary.cloudName || cloudinary.signEndpoint;
            const cloudinaryScript = hasCloudinary
              ? `window.CLOUDINARY_CONFIG = ${JSON.stringify(cloudinary)};\n`
              : "";
            fs.writeFileSync(
              "firebase.config.js",
              `window.FIREBASE_CONFIG = ${JSON.stringify(config)};\n${cloudinaryScript}`
            );
          '

      - name: Paketera webbplats
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
