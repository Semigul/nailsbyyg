name: Publicera till GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: E2E-tester
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installera Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Installera testwebbläsare
        run: npx playwright install --with-deps chromium

      - name: Kör kvalitetskontroller och E2E
        run: npm test

  deploy:
    name: Publicera
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Skapa Firebase-konfiguration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::error::Repository secret FIREBASE_CONFIG saknas"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const config = JSON.parse(process.env.FIREBASE_CONFIG);
            const required = ["apiKey", "authDomain", "projectId", "appId"];
            const missing = required.filter((key) => !config[key]);
            if (missing.length) {
              throw new Error(`FIREBASE_CONFIG saknar: ${missing.join(", ")}`);
            }
            const cloudinary = config.cloudinary || {
              cloudName: config.cloudinaryCloudName,
              signEndpoint: config.cloudinarySignEndpoint,
              uploadPreset: config.cloudinaryUploadPreset,
              folder: config.cloudinaryFolder || "nailsbyyg-orders"
            };
            const hasCloudinary = cloudinary.cloudName || cloudinary.signEndpoint;
            const cloudinaryScript = hasCloudinary
              ? `window.CLOUDINARY_CONFIG = ${JSON.stringify(cloudinary)};\n`
              : "";
            fs.writeFileSync(
              "firebase.config.js",
              `window.FIREBASE_CONFIG = ${JSON.stringify(config)};\n${cloudinaryScript}`
            );
          '

      - name: Paketera webbplats
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
